<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6G SUPER-FAST PRO FINDER</title>
    <!-- Library for generating Long Screenshots -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-body: #0f172a; /* Slate 900 */
            --bg-card: #1e293b; /* Slate 800 */
            --bg-input: #0f172a;
            --border-color: #334155; /* Slate 700 */
            --text-primary: #f8fafc; /* Slate 50 */
            --text-secondary: #94a3b8; /* Slate 400 */
            --accent-blue: #3b82f6; /* Blue 500 */
            --accent-green: #10b981; /* Emerald 500 */
            --accent-indigo: #6366f1; /* Indigo 500 */
        }

        html, body {
            background-color: var(--bg-body) !important;
            margin: 0; padding: 0; min-height: 100vh;
            color: var(--text-primary) !important;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; justify-content: center; align-items: flex-start;
        }

        .main-card {
            width: 100%; max-width: 650px; margin: 40px auto; padding: 32px;
            background-color: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h2 { 
            text-align: center; margin-bottom: 24px; color: var(--text-primary); 
            font-size: 20px; font-weight: 700; letter-spacing: 0.5px;
        }
        
        h2 span { color: var(--accent-blue); }

        .ui-hide { display: block; }
        
        input { 
            width: 100%; padding: 14px 16px; margin-bottom: 20px;
            background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 10px; color: var(--text-primary); font-size: 15px;
            box-sizing: border-box; outline: none; transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .btn-box { display: flex; gap: 12px; margin-bottom: 24px; }
        
        button { 
            flex: 1; padding: 12px; font-size: 12px; font-weight: 600; 
            cursor: pointer; border-radius: 8px; border: none;
            color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px;
            transition: transform 0.1s, opacity 0.2s;
        }
        
        button:active { transform: scale(0.98); }
        button:hover { opacity: 0.9; }

        #searchBtn { background-color: var(--accent-blue); }
        #copyBtn { background-color: var(--accent-green); }
        #printBtn { background-color: var(--accent-indigo); }

        .found-banner {
            text-align: center; color: var(--accent-green); font-weight: 600;
            font-size: 14px; margin-bottom: 16px; padding: 12px;
            border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px;
            background: rgba(16, 185, 129, 0.1);
        }

        .result-container {
            background-color: var(--bg-body) !important; 
            border: 1px solid var(--border-color) !important;
            border-radius: 10px; overflow: hidden; margin-bottom: 24px;
        }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); vertical-align: top; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        .label { color: var(--text-primary); font-weight: 600; width: 40%; }
        
        .footer-credit {
            text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 16px; font-weight: 500;
        }

        @media print {
            .ui-hide { display: none !important; }
        }
    </style>
</head>
<body>

<div class="main-card" id="capture-area">
    <h2>Design by: <span>6G Super-Fast</span></h2>
    
    <div class="ui-hide" id="ui-controls">
        <input id="input" placeholder="IFSC ya 6-Digit PINCODE dalo..." maxlength="11" />
        <div class="btn-box">
            <button id="searchBtn">🚀 Search</button>
            <button id="copyBtn">📋 Copy All</button>
            <button id="printBtn">📸 Long Screenshot</button>
        </div>
    </div>

    <div id="res-wrapper"></div>
</div>

<script>
    const toUpper = (val) => (val !== null && val !== undefined && val !== "" && val !== false) ? String(val).toUpperCase() : "N/A";

    const backupNumbers = {
        "SBIN": "18001234", "HDFC": "18002026161", "ICIC": "18001080", 
        "PUNB": "18001802222", "BARB": "18002584455", "CNRB": "18004250018", 
        "IOBA": "18004254445", "UBIN": "1800222244", "KKBK": "18602662666"
    };

    document.getElementById("searchBtn").addEventListener("click", async function () {
        const input = document.getElementById("input").value.trim().toUpperCase();
        const wrapper = document.getElementById("res-wrapper");
        
        if (!input) return;
        wrapper.innerHTML = "<p style='text-align:center; color: var(--text-secondary);'>Searching Live Database... ⚡</p>";

        try {
            if (/^[A-Z]{4}0[A-Z0-9]{6}$/.test(input)) {
                const res = await fetch(`https://ifsc.razorpay.com/${input}`);
                const data = await res.json();
                
                let contact = data.CONTACT || "";
                if(input === "IOBA0003755") contact = "8925953755";
                if(contact.includes("/")) contact = contact.split(/[/,]/)[0].trim();
                contact = contact.replace(/\s+/g, '').replace(/^\+91/, '');

                if(!contact || contact === "N/A") {
                    contact = backupNumbers[input.substring(0, 4)] || "1800-BANK-HELP";
                }

                wrapper.innerHTML = `
                <div class="found-banner">FOUND : 1 BANK RECORD</div>
                <div class="result-container">
                    <table>
                        <thead><tr><th colspan="2" style="background:var(--bg-input); color:var(--accent-blue); padding:12px 16px; font-size:14px; text-align:left; border-bottom:1px solid var(--border-color);">✅ BANK DETAILS SYNCED</th></tr></thead>
                        <tbody>
                            <tr><td class="label">BANK NAME</td><td>${toUpper(data.BANK)}</td></tr>
                            <tr><td class="label">IFSC CODE</td><td>${toUpper(data.IFSC)}</td></tr>
                            <tr><td class="label">UPI</td><td>${data.UPI ? "YES" : "NO"}</td></tr>
                            <tr><td class="label">IMPS</td><td>${data.IMPS ? "YES" : "NO"}</td></tr>
                            <tr><td class="label">NEFT</td><td>${data.NEFT ? "YES" : "NO"}</td></tr>
                            <tr><td class="label">RTGS</td><td>${data.RTGS ? "YES" : "NO"}</td></tr>
                            <tr><td class="label">BRANCH</td><td>${toUpper(data.BRANCH)}</td></tr>                         
                            <tr><td class="label">MOBILE NO</td><td style="color:var(--accent-green); font-weight:600;">${contact}</td></tr>                          
                            <tr><td class="label">CITY</td><td>${toUpper(data.CITY)}</td></tr>                        
                            <tr><td class="label">DIST</td><td>${toUpper(data.DISTRICT)}</td></tr>
                            <tr><td class="label">STATE</td><td>${toUpper(data.STATE)}</td></tr>
                            <tr><td class="label">ADDRESS</td><td>${toUpper(data.ADDRESS)}</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="footer-credit">⚡ CREDIT: 6G SUPER-FAST ⚡</div>`;
            } 
            else if (/^\d{6}$/.test(input)) {
                const pinRes = await fetch(`https://api.postalpincode.in/pincode/${input}`);
                const pinJson = await pinRes.json();
                if (pinJson[0].Status === "Success") {
                    const offices = pinJson[0].PostOffice;
                    let htmlContent = `<div class="found-banner">FOUND : ${offices.length} ALL PINCODE DETAILS</div>`;
                    
                    offices.forEach((p, index) => {
                        htmlContent += `
                        <div class="result-container">
                            <table>
                                <thead><tr><th colspan="2" style="background:var(--bg-input); color:var(--accent-blue); padding:12px 16px; font-size:14px; text-align:left; border-bottom:1px solid var(--border-color);">📍 LOCATION ${index + 1}: ${toUpper(p.Name)}</th></tr></thead>
                                <tbody>
                                    <tr><td class="label">TOWN NAME</td><td>${toUpper(p.Name)}</td></tr>
                                    <tr><td class="label">VILLAGE</td><td>${toUpper(p.Name)}</td></tr>
                                    <tr><td class="label">POST OFFICE</td><td>${toUpper(p.Name)}</td></tr>
                                    <tr><td class="label">BRANCH TYPE</td><td>${toUpper(p.BranchType)}</td></tr>
                                    <tr><td class="label">DELIVERY</td><td>${toUpper(p.DeliveryStatus)}</td></tr>
                                    <tr><td class="label">TEHSIL</td><td>${toUpper(p.Block)}</td></tr>
                                    <tr><td class="label">DISTRICT</td><td>${toUpper(p.District)}</td></tr>
                                    <tr><td class="label">DIVISION</td><td>${toUpper(p.Division)}</td></tr>
                                    <tr><td class="label">REGION</td><td>${toUpper(p.Region)}</td></tr>
                                    <tr><td class="label">CIRCLE</td><td>${toUpper(p.Circle)}</td></tr>
                                    <tr><td class="label">STATE</td><td>${toUpper(p.State)}</td></tr>
                                    <tr><td class="label">PINCODE</td><td>${input}</td></tr>
                                </tbody>
                            </table>
                        </div>`;
                    });
                    wrapper.innerHTML = htmlContent + `<div class="footer-credit">⚡ CREDIT: 6G SUPER-FAST ⚡</div>`;
                }
            }
        } catch (err) { wrapper.innerHTML = "<p style='text-align:center; color:#ef4444; font-weight:600;'>❌ RECORD NOT FOUND!</p>"; }
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
        const wrapper = document.getElementById("res-wrapper");
        if (!wrapper.innerText) return;
        const containers = document.querySelectorAll('.result-container');
        let copyText = "⚡ CREDIT: 6G SUPER-FAST ⚡\n\n";
        containers.forEach((container) => {
            const rows = container.querySelectorAll('tr');
            rows.forEach(row => {
                const label = row.querySelector('.label')?.innerText || "";
                const value = row.cells[1]?.innerText || "";
                if(label) copyText += `${label}\t: ${value}\n`;
            });
            copyText += "-----------------------\n";
        });
        copyText += "\n⚡ CREDIT: 6G SUPER-FAST ⚡";
        const tempInput = document.createElement("textarea");
        tempInput.value = copyText;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        alert("✅ ALL DATA COPIED!");
    });

    // NEW LOGIC FOR SEAMLESS LONG SCREENSHOT
    document.getElementById("printBtn").addEventListener("click", () => {
        const captureArea = document.getElementById("capture-area");
        const uiControls = document.getElementById("ui-controls");
        const wrapper = document.getElementById("res-wrapper");

        if (!wrapper.innerText) {
            alert("⚠️ Pehle kuch search karo!");
            return;
        }

        // Hide inputs/buttons temporarily so they don't show up in the image
        uiControls.style.display = "none";
        
        // Capture the card as a high-quality image
        html2canvas(captureArea, {
            backgroundColor: "#0f172a",
            scale: 2 // Boosts resolution
        }).then(canvas => {
            // Create a fake link to trigger the download
            const link = document.createElement("a");
            link.download = "6G_Result_Long.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            
            // Bring the inputs back
            uiControls.style.display = "block";
        }).catch(err => {
            alert("❌ Screenshot lene me problem hui!");
            uiControls.style.display = "block";
        });
    });
</script>

</body>
</html>
